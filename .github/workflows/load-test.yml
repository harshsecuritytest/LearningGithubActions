name: Perfected Distributed Load Test

on:
  workflow_dispatch:

jobs:
  load-test:
    strategy:
      matrix:
        include:
          - machine: 1
            base: 0
          - machine: 2
            base: 250000
          - machine: 3
            base: 500000
          - machine: 4
            base: 750000

    runs-on: ubuntu-latest
    name: Machine ${{ matrix.machine }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Load Engine
        run: sudo apt-get update && sudo apt-get install -y wrk

      - name: Execute Attack Grid
        env:
          MACHINE_BASE: ${{ matrix.base }}
        # Fully corrected subdomain target with standard core-to-connection ratio
        run: wrk -t2 -c40 -d270s -s load-test.lua https://cdcserver.acropolis.teamzemo.tech